<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3PM · Round 2: Survivor Battle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Bubblegum Sans', cursive;
    background: linear-gradient(135deg, #FF6B6B, #EE5A6F);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 20px 0;
    overflow: auto;
}

/* ===== TIMER (TOP TO BOTTOM) ===== */
.timer-container {
    position: fixed;
    right: 0;
    top: 0;
    width: 18px;
    height: 100vh;
    background: rgba(0,0,0,0.15);
    z-index: 100;
}

.timer-bar {
    width: 100%;
    height: 0%;
    background: #00FF00;
    position: absolute;
    top: 0;
    left: 0;
    animation: countdown 600s linear forwards;
}

@keyframes countdown {
    from { height: 0%; }
    to { height: 100%; }
}

/* ===== MAIN CARD ===== */
.card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 1000px;
    width: calc(100% - 40px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
    margin: 20px auto;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.card::-webkit-scrollbar {
    width: 10px;
}

.card::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.card::-webkit-scrollbar-thumb {
    background: #FF6B6B;
    border-radius: 10px;
}

.round-title {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    color: #FF6B6B;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.stage-subtitle {
    font-size: 20px;
    margin-bottom: 20px;
    color: #666;
    flex-shrink: 0;
}

.question-number {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #4ECDC4;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.question-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 15px;
    padding: 30px;
    color: white;
    margin-bottom: 25px;
    flex-shrink: 0;
}

.original-sentence {
    font-size: 26px;
    margin-bottom: 20px;
    word-wrap: break-word;
    line-height: 1.4;
}

.change-instruction {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #FFD700;
    word-wrap: break-word;
}

/* ===== ANSWER SECTION ===== */
.answer-section {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    flex-shrink: 0;
}

.answer-section::-webkit-scrollbar {
    width: 8px;
}

.answer-section::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.answer-section::-webkit-scrollbar-thumb {
    background: #FF6B6B;
    border-radius: 10px;
}

.answer-label {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #FF6B6B;
    margin-bottom: 15px;
}

.answer-text {
    font-size: 24px;
    color: #2c3e50;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 3px solid #FF6B6B;
    word-wrap: break-word;
}

/* ===== CONTROLS ===== */
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 15px 0 5px 0;
    background: white;
    border-top: 2px solid #f0f0f0;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 10;
}

.control-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    padding: 15px 40px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    min-width: 180px;
}

.control-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-show {
    background: linear-gradient(145deg, #4ECDC4, #44A08D);
}

.btn-next {
    background: linear-gradient(145deg, #FFD700, #FFA500);
}

.btn-end {
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
}

.btn-home {
    background: linear-gradient(145deg, #95a5a6, #7f8c8d);
}

.hidden { display: none !important; }

/* ===== MODAL POPUP ===== */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    animation: modalPop 0.5s ease-out;
}

@keyframes modalPop {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.modal-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
}

.modal-content h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #FF6B6B;
    margin-bottom: 20px;
}

.modal-content p {
    font-size: 24px;
    margin-bottom: 30px;
    color: #333;
}

.modal-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    padding: 15px 50px;
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.modal-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

@media (max-width: 768px) {
    .controls {
        flex-direction: column;
        position: static;
    }
    
    .control-btn {
        width: 100%;
        min-width: auto;
        font-size: 20px;
        padding: 15px 25px;
    }
    
    .modal-content {
        padding: 30px;
    }
    
    .modal-content h2 {
        font-size: 36px;
    }
    
    .modal-icon {
        font-size: 60px;
    }
}
</style>
</head>

<body>

<!-- TIMER -->
<div class="timer-container">
    <div class="timer-bar"></div>
</div>

<!-- GAME VIEW -->
<div class="card" id="gameView">
    <div class="round-title">⚔️ Survivor Battle</div>
    <div class="stage-subtitle">Last one standing wins!</div>
    
    <div class="question-number" id="questionNumber">Loading questions...</div>

    <div class="question-box">
        <div class="original-sentence" id="originalSentence"></div>
        <div class="change-instruction" id="instruction"></div>
    </div>

    <div class="answer-section" id="answerSection">
        <div class="answer-label">✓ Correct Answer</div>
        <div class="answer-text" id="answerText"></div>
    </div>

    <div class="controls">
        <button class="control-btn btn-show" id="showAnswerBtn">Show Answer</button>
        <button class="control-btn btn-next hidden" id="nextBtn">Next</button>
        <button class="control-btn btn-end" id="endBtn">End Game</button>
        <button class="control-btn btn-home" onclick="location.href='index.html'">Home</button>
    </div>
</div>

<!-- TIME'S UP MODAL -->
<div class="modal-overlay" id="timesUpModal">
    <div class="modal-content">
        <div class="modal-icon">⏰</div>
        <h2>TIME'S UP!</h2>
        <p>The round has ended</p>
        <button class="modal-btn" id="modalOkBtn">OK</button>
    </div>
</div>

<script>
// Sentence Master – October 2026 – 3PM class (96 questions, from Sentence_Master_Oct_2026.xlsx)
const SM_DATA = "question #\toriginal sentence\tchange to\tanswer\n1\tThe boy is tired.\tThey\tThey are tired.\n2\tMy sister walks to school.\tYesterday\tMy sister walked to school yesterday.\n3\tThere is a book on the desk.\tPlural\tThere are books on the desk.\n4\tKevin likes basketball.\tNegative\tKevin doesn't like basketball.\n5\tThey are eating lunch.\tQuestion\tAre they eating lunch?\n6\tI have a new backpack.\tShe\tShe has a new backpack.\n7\tThe children play in the park.\tNow\tThe children are playing in the park now.\n8\tAmy can ride a bike.\tNegative\tAmy can't ride a bike.\n9\tHe goes to school by bus.\tQuestion\tDoes he go to school by bus?\n10\tThe girl is happy.\tYesterday\tThe girl was happy yesterday.\n11\tWe watched TV last night.\tEvery night\tWe watch TV every night.\n12\tTom has a cold.\tThey\tThey have a cold.\n13\tThe girl is hungry.\tThey\tThey are hungry.\n14\tMy brother cleans his room.\tYesterday\tMy brother cleaned his room yesterday.\n15\tThere is a pencil in the bag.\tPlural\tThere are pencils in the bag.\n16\tSarah likes apples.\tNegative\tSarah doesn't like apples.\n17\tThey are playing soccer.\tQuestion\tAre they playing soccer?\n18\tI have a blue jacket.\tHe\tHe has a blue jacket.\n19\tThe boys read books after school.\tNow\tThe boys are reading books now.\n20\tJenny can swim well.\tNegative\tJenny can't swim well.\n21\tHe eats breakfast at seven.\tQuestion\tDoes he eat breakfast at seven?\n22\tThe dog is sleepy.\tYesterday\tThe dog was sleepy yesterday.\n23\tWe visited Grandma yesterday.\tEvery Sunday\tWe visit Grandma every Sunday.\n24\tMina has a new pencil case.\tThey\tThey have a new pencil case.\n25\tThe girl is cold.\tThey\tThey are cold.\n26\tMy father washes the car.\tYesterday\tMy father washed the car yesterday.\n27\tThere is an orange on the table.\tPlural\tThere are oranges on the table.\n28\tJason likes comic books.\tNegative\tJason doesn't like comic books.\n29\tThe boys are running outside.\tQuestion\tAre the boys running outside?\n30\tI have a small umbrella.\tHe\tHe has a small umbrella.\n31\tThe students study English after school.\tNow\tThe students are studying English now.\n32\tLucy can play the piano.\tNegative\tLucy can't play the piano.\n33\tHe drinks milk every morning.\tQuestion\tDoes he drink milk every morning?\n34\tThe children are excited.\tYesterday\tThe children were excited yesterday.\n35\tWe played basketball yesterday.\tEvery Saturday\tWe play basketball every Saturday.\n36\tAnna has a yellow bag.\tThey\tThey have a yellow bag.\n37\tThe boy is hungry.\tThey\tThey are hungry.\n38\tMy mother cooks dinner every night.\tYesterday\tMy mother cooked dinner yesterday.\n39\tThere is a cup on the table.\tPlural\tThere are cups on the table.\n40\tEmma likes cats.\tNegative\tEmma doesn't like cats.\n41\tThey are waiting for the bus.\tQuestion\tAre they waiting for the bus?\n42\tI have a new jacket.\tShe\tShe has a new jacket.\n43\tThe children play outside after school.\tNow\tThe children are playing outside now.\n44\tDavid can speak English.\tNegative\tDavid can't speak English.\n45\tHe walks to work every day.\tQuestion\tDoes he walk to work every day?\n46\tThe girls are tired today.\tYesterday\tThe girls were tired yesterday.\n47\tWe watched a movie last night.\tEvery Friday\tWe watch a movie every Friday.\n48\tLisa has a small dog.\tThey\tThey have a small dog.\n49\tThe girl is nervous.\tThey\tThey are nervous.\n50\tMy uncle visits us every weekend.\tYesterday\tMy uncle visited us yesterday.\n51\tThere is a sandwich in the bag.\tPlural\tThere are sandwiches in the bag.\n52\tHenry watches TV after dinner.\tNegative\tHenry doesn't watch TV after dinner.\n53\tThe children are making a poster.\tQuestion\tAre the children making a poster?\n54\tI have a black bicycle.\tShe\tShe has a black bicycle.\n55\tThe girls talk to their teacher every morning.\tNow\tThe girls are talking to their teacher now.\n56\tLucy can cook dinner.\tNegative\tLucy can't cook dinner.\n57\tMark gets up at seven.\tQuestion\tDoes Mark get up at seven?\n58\tThe classroom is quiet today.\tYesterday\tThe classroom was quiet yesterday.\n59\tWe went shopping yesterday.\tEvery Saturday\tWe go shopping every Saturday.\n60\tBen has a new computer.\tThey\tThey have a new computer.\n61\tThe boy is thirsty.\tThey\tThey are thirsty.\n62\tMy aunt calls me every Sunday.\tYesterday\tMy aunt called me yesterday.\n63\tThere is a key on the table.\tPlural\tThere are keys on the table.\n64\tNina reads before bed.\tNegative\tNina doesn't read before bed.\n65\tThe students are cleaning the classroom.\tQuestion\tAre the students cleaning the classroom?\n66\tI have a red umbrella.\tHe\tHe has a red umbrella.\n67\tThe boys ride their bikes after school.\tNow\tThe boys are riding their bikes now.\n68\tEmma can make pancakes.\tNegative\tEmma can't make pancakes.\n69\tDavid leaves home at eight.\tQuestion\tDoes David leave home at eight?\n70\tThe park is crowded today.\tYesterday\tThe park was crowded yesterday.\n71\tWe ate dinner at home yesterday.\tEvery night\tWe eat dinner at home every night.\n72\tLeo has a new phone.\tThey\tThey have a new phone.\n73\tThe girl is afraid.\tThey\tThey are afraid.\n74\tMy brother washes the dishes every night.\tYesterday\tMy brother washed the dishes yesterday.\n75\tThere is a cookie on the plate.\tPlural\tThere are cookies on the plate.\n76\tJason plays computer games after school.\tNegative\tJason doesn't play computer games after school.\n77\tThe children are waiting outside.\tQuestion\tAre the children waiting outside?\n78\tI have a new watch.\tShe\tShe has a new watch.\n79\tThe girls walk home together.\tNow\tThe girls are walking home together now.\n80\tKevin can carry the box.\tNegative\tKevin can't carry the box.\n81\tAmy studies English every evening.\tQuestion\tDoes Amy study English every evening?\n82\tThe street is noisy today.\tYesterday\tThe street was noisy yesterday.\n83\tWe bought snacks yesterday.\tEvery Friday\tWe buy snacks every Friday.\n84\tDaniel has a brown backpack.\tThey\tThey have a brown backpack.\n85\tThe boy is worried.\tThey\tThey are worried.\n86\tMy cousin visits us every month.\tYesterday\tMy cousin visited us yesterday.\n87\tThere is a bottle on the table.\tPlural\tThere are bottles on the table.\n88\tEmily watches cartoons after dinner.\tNegative\tEmily doesn't watch cartoons after dinner.\n89\tThe students are carrying their books.\tQuestion\tAre the students carrying their books?\n90\tI have a new camera.\tHe\tHe has a new camera.\n91\tThe boys play basketball after school.\tNow\tThe boys are playing basketball now.\n92\tLucy can make cookies.\tNegative\tLucy can't make cookies.\n93\tDaniel walks to school every morning.\tQuestion\tDoes Daniel walk to school every morning?\n94\tThe library is quiet today.\tYesterday\tThe library was quiet yesterday.\n95\tWe went to the park yesterday.\tEvery Sunday\tWe go to the park every Sunday.\n96\tAnna has a small cat.\tThey\tThey have a small cat.";
</script>
<script>
let questions = [];
let index = 0;
let timerTimeout;

$(document).ready(function() {
    // Get the selected CSV file from localStorage
    const selectedCsvFile = '3PM October 2026 (built-in)';
    
    if (!selectedCsvFile) {
        alert('No CSV file selected. Please go back and choose a level.');
        window.location.href = 'index.html';
        return;
    }
    
    console.log('Loading CSV file:', selectedCsvFile);
    
    Promise.resolve(new Response(SM_DATA))
        .then(r => {
            if (!r.ok) {
                throw new Error(`Could not load ${selectedCsvFile}`);
            }
            return r.text();
        })
        .then(csv => {
            console.log('CSV loaded, length:', csv.length);
            console.log('First 200 chars:', csv.substring(0, 200));
            
            const lines = csv.split('\n');
            console.log('Total lines:', lines.length);
            
            // Check the header to understand column structure
            const headerLine = lines[0];
            console.log('Header:', headerLine);
            
            // Determine delimiter
            const delimiter = headerLine.includes('\t') ? '\t' : ',';
            console.log('Using delimiter:', delimiter);
            
            // Start from line 1 (skip header)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '') {
                    console.log(`Line ${i} is empty, skipping`);
                    continue;
                }
                
                let parts;
                if (delimiter === '\t') {
                    parts = line.split('\t');
                } else {
                    parts = line.split(',');
                }
                
                console.log(`Line ${i} parts:`, parts.length);
                
                // Based on your CSV structure, columns are:
                // parts[0] = Question #
                // parts[1] = Original Sentence (EN)
                // parts[2] = Change To
                // parts[3] = Answer
                
                if (parts.length >= 4) {
                    const question = {
                        original: parts[1] ? parts[1].trim() : '',
                        changeTo: parts[2] ? parts[2].trim() : '',
                        answer: parts[3] ? parts[3].trim() : ''
                    };
                    
                    // Only add if all fields have content
                    if (question.original && question.changeTo && question.answer) {
                        questions.push(question);
                        console.log(`Added question ${questions.length}:`, question.original.substring(0, 30));
                    } else {
                        console.log('Skipping line - missing fields:', question);
                    }
                } else {
                    console.log(`Line ${i} has insufficient parts:`, parts.length);
                }
            }
            
            console.log('Total questions loaded:', questions.length);
            
            if (questions.length === 0) {
                alert('No valid questions found in the CSV file. Please check the file format.');
                return;
            }
            
            // Shuffle questions
            questions.sort(() => Math.random() - 0.5);
            
            showQuestion();
            
            // Set timer for 10 minutes (600000 ms)
            timerTimeout = setTimeout(function() {
                showTimesUpModal();
            }, 600000);
            
            // Listen for animation end on timer bar
            $('.timer-bar').on('animationend', function() {
                showTimesUpModal();
            });
        })
        .catch(error => {
            alert('Error loading CSV: ' + error.message);
            console.error('Fetch error:', error);
        });
});

function showQuestion() {
    if (index >= questions.length) {
        // End of questions - go to index page
        clearTimeout(timerTimeout);
        location.href = 'index.html';
        return;
    }

    const q = questions[index];
    console.log(`Showing question ${index + 1}:`, q);
    
    $('#questionNumber').text(`Question ${index + 1} of ${questions.length}`);
    $('#originalSentence').text(q.original);
    $('#instruction').text(`→ Change to: ${q.changeTo}`);
    $('#answerText').text(q.answer);

    // Hide answer section and reset buttons
    $('#answerSection').hide();
    $('#showAnswerBtn').removeClass('hidden');
    $('#nextBtn').addClass('hidden');
    // End Game button is always visible
    
    // Scroll to top
    $('.card').scrollTop(0);
}

$('#showAnswerBtn').on('click', function() {
    $('#answerSection').slideDown(300, function() {
        // After answer is shown, scroll to make sure buttons are visible
        $('.card').animate({
            scrollTop: $('.card')[0].scrollHeight
        }, 500);
    });
    $(this).addClass('hidden');
    $('#nextBtn').removeClass('hidden');
    // End Game button remains visible
});

$('#nextBtn').on('click', function() {
    index++;
    showQuestion();
});

$('#endBtn').on('click', function() {
    // Show confirmation dialog
    if (confirm('Are you sure you want to end the game?')) {
        clearTimeout(timerTimeout);
        // Go directly to index page
        location.href = 'index.html';
    }
});

function showTimesUpModal() {
    // Clear the timeout to prevent multiple triggers
    clearTimeout(timerTimeout);
    
    // Show the modal
    $('#timesUpModal').fadeIn(300).css('display', 'flex');
    
    // Pause the timer animation
    $('.timer-bar').css('animation-play-state', 'paused');
}

// Modal OK button click
$('#modalOkBtn').on('click', function() {
    // Go to index page
    location.href = 'index.html';
});

// Clear timeout when leaving page
window.addEventListener('beforeunload', function() {
    clearTimeout(timerTimeout);
});
</script>

</body>
</html>
