<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3PM · Round 2: Survivor Battle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Bubblegum Sans', cursive;
    background: linear-gradient(135deg, #FF6B6B, #EE5A6F);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 20px 0;
    overflow: auto;
}

/* ===== TIMER (TOP TO BOTTOM) ===== */
.timer-container {
    position: fixed;
    right: 0;
    top: 0;
    width: 18px;
    height: 100vh;
    background: rgba(0,0,0,0.15);
    z-index: 100;
}

.timer-bar {
    width: 100%;
    height: 0%;
    background: #00FF00;
    position: absolute;
    top: 0;
    left: 0;
    animation: countdown 600s linear forwards;
}

@keyframes countdown {
    from { height: 0%; }
    to { height: 100%; }
}

/* ===== MAIN CARD ===== */
.card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    max-width: 1000px;
    width: calc(100% - 40px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    text-align: center;
    margin: 20px auto;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.card::-webkit-scrollbar {
    width: 10px;
}

.card::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.card::-webkit-scrollbar-thumb {
    background: #FF6B6B;
    border-radius: 10px;
}

.round-title {
    font-family: 'Fredoka One', cursive;
    font-size: 42px;
    color: #FF6B6B;
    margin-bottom: 10px;
    flex-shrink: 0;
}

.stage-subtitle {
    font-size: 20px;
    margin-bottom: 20px;
    color: #666;
    flex-shrink: 0;
}

.question-number {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #4ECDC4;
    margin-bottom: 20px;
    flex-shrink: 0;
}

.question-box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 15px;
    padding: 30px;
    color: white;
    margin-bottom: 25px;
    flex-shrink: 0;
}

.original-sentence {
    font-size: 26px;
    margin-bottom: 20px;
    word-wrap: break-word;
    line-height: 1.4;
}

.change-instruction {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #FFD700;
    word-wrap: break-word;
}

/* ===== ANSWER SECTION ===== */
.answer-section {
    background: #f8f9fa;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    flex-shrink: 0;
}

.answer-section::-webkit-scrollbar {
    width: 8px;
}

.answer-section::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}

.answer-section::-webkit-scrollbar-thumb {
    background: #FF6B6B;
    border-radius: 10px;
}

.answer-label {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #FF6B6B;
    margin-bottom: 15px;
}

.answer-text {
    font-size: 24px;
    color: #2c3e50;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 3px solid #FF6B6B;
    word-wrap: break-word;
}

/* ===== CONTROLS ===== */
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    padding: 15px 0 5px 0;
    background: white;
    border-top: 2px solid #f0f0f0;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
    z-index: 10;
}

.control-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    padding: 15px 40px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: white;
    text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
    min-width: 180px;
}

.control-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.btn-show {
    background: linear-gradient(145deg, #4ECDC4, #44A08D);
}

.btn-next {
    background: linear-gradient(145deg, #FFD700, #FFA500);
}

.btn-end {
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
}

.btn-home {
    background: linear-gradient(145deg, #95a5a6, #7f8c8d);
}

.hidden { display: none !important; }

/* ===== MODAL POPUP ===== */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 40px;
    border-radius: 30px;
    text-align: center;
    max-width: 500px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    animation: modalPop 0.5s ease-out;
}

@keyframes modalPop {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.modal-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
}

.modal-content h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #FF6B6B;
    margin-bottom: 20px;
}

.modal-content p {
    font-size: 24px;
    margin-bottom: 30px;
    color: #333;
}

.modal-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    padding: 15px 50px;
    background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
    border: none;
    border-radius: 50px;
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.modal-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

@media (max-width: 768px) {
    .controls {
        flex-direction: column;

        min-width: auto;

    }

    }

}

ve blue blankets.\n25\tI usually eat breakfast at seven.\tYesterday\tI ate breakfast at seven yesterday.\n26\tShe buys new shoes every year.\tYesterday\tShe bought new shoes yesterday.\n27\tThey are waiting for the bus.\tQuestion\tAre they waiting for the bus?\n28\tHe drinks coffee every morning.\tNegative\tHe doesn’t drink coffee every morning.\n29\tI do my homework after dinner.\tHe\tHe does his homework after dinner.\n30\tMy brother can swim very well.\tNegative\tMy brother can’t swim very well.\n31\tWe visit the museum every Saturday.\tLast Saturday\tWe visited the museum last Saturday.\n32\tThere is a book on the table.\tThree\tThere are three books on the table.\n33\tShe gets to school by bus.\tHow\tHow does she get to school?\n34\tTom wears a blue jacket.\tNow\tTom is wearing a blue jacket now.\n35\tEmma reads before bed.\tNegative\tEmma doesn’t read before bed.\n36\tIt was raining. We stayed home.\tbecause\tWe stayed home because it was raining.\n37\tMy sister rides her bike to school.\tYesterday\tMy sister rode her bike to school yesterday.\n38\tThe man is carrying two boxes.\tQuestion\tIs the man carrying two boxes?\n39\tThere is a knife on the table.\tPlural\tThere are knives on the table.\n40\tJulia studies in the library after school.\tNegative\tJulia doesn’t study in the library after school.\n41\tI have a black umbrella.\tHe\tHe has a black umbrella.\n42\tThe children play near the river on Sundays.\tNow\tThe children are playing near the river now.\n43\tMarcus can answer the question.\tNegative\tMarcus can’t answer the question.\n44\tHelen visits her cousin every month.\tQuestion\tDoes Helen visit her cousin every month?\n45\tThe market is crowded today.\tYesterday\tThe market was crowded yesterday.\n46\tWe took photos yesterday.\tEvery holiday\tWe take photos every holiday.\n47\tLiam has a new pair of glasses.\tThey\tThey have new pairs of glasses.\n48\tThe bus was late. We waited outside.\tbecause\tWe waited outside because the bus was late.",

ally speak to him after class.\tYesterday\tI spoke to him after class yesterday.\n22\tThis movie is interesting. That movie is boring.\tthan\tThis movie is more interesting than that movie.\n23\tYou should check the address first.\tQuestion\tShould you check the address first?\n24\tOliver finished the meeting. Then he went home.\tafter\tOliver went home after he finished the meeting.\n25\tDaniel takes the train to work every day.\tYesterday\tDaniel took the train to work yesterday.\n26\tI meet my friends every Friday.\tLast night\tI met my friends last night.\n27\tThey travel every summer.\tNext weekend\tThey will travel next weekend.\n28\tShe went out. She was tired.\tbecause\tShe went out because she was tired.\n29\tThis jacket is cheap. That jacket is expensive.\tthan\tThis jacket is cheaper than that jacket.\n30\tYou leave at eight.\tshould\tYou should leave at eight.\n31\tHe ate dinner. Then he finished his homework.\tafter\tHe finished his homework after he ate dinner.\n32\tYou have been to Japan.\tQuestion\tHave you been to Japan?\n33\tMy phone is expensive. Your phone is cheap.\tthan\tMy phone is more expensive than your phone.\n34\tShe cooked dinner. She listened to music.\twhile\tShe listened to music while she was cooking dinner.\n35\tThe room is small for everyone.\tnot enough\tThe room isn’t big enough for everyone.\n36\tThis book is interesting.\tI think...\tI think this book is interesting.\n37\tRebecca reads the news every morning.\tYesterday\tRebecca read the news yesterday.\n38\tThey drove to the mountains last weekend.\tNext weekend\tThey will drive to the mountains next weekend.\n39\tSamuel enjoys working in quiet places.\tNegative\tSamuel doesn’t enjoy working in quiet places.\n40\tChloe is choosing a new laptop.\tQuestion\tIs Chloe choosing a new laptop?\n41\tThe café was full. We found a seat.\tbut\tThe café was full, but we found a seat.\n42\tHenry went home early. He felt sick.\tbecause\tHenry went home early because he felt sick.\n43\tThis river is wide. That river is narrow.\tthan\tThis river is wider than that river.\n44\tMegan is going to take a driving test.\tQuestion\tIs Megan going to take a driving test?\n45\tI usually catch the 8:00 bus.\tYesterday\tI caught the 8:00 bus yesterday.\n46\tThis problem is complicated. That problem is simple.\tthan\tThis problem is more complicated than that problem.\n47\tYou should speak more slowly.\tQuestion\tShould you speak more slowly?\n48\tAaron locked the door. Then he left the building.\tafter\tAaron left the building after he locked the door.",

de a bike.\n30\tAmy has a red bag.\tThey\tThey have a red bag.\n31\tThey play soccer after school.\tQuestion\tDo they play soccer after school?\n32\tTom likes milk.\tNegative\tTom doesn’t like milk.\n33\tThere is a cup on the table.\tTwo\tThere are two cups on the table.\n34\tHe goes to bed at nine.\tWhen\tWhen does he go to bed?\n35\tI was happy yesterday.\tToday\tI am happy today.\n36\tWe have bread. We have cheese.\tand\tWe have bread and cheese.\n37\tI like mangoes.\tShe\tShe likes mangoes.\n38\tEric has a green cap.\tThey\tThey have green caps.\n39\tThe towel is on the chair.\tPlural\tThe towels are on the chair.\n40\tWe help our teacher every Friday.\tYesterday\tWe helped our teacher yesterday.\n41\tHe is opening his lunch box.\tQuestion\tIs he opening his lunch box?\n42\tNina likes fish.\tNegative\tNina doesn’t like fish.\n43\tThere are three pencils on the floor.\tSingular\tThere is a pencil on the floor.\n44\tThey play cards after dinner.\tNow\tThey are playing cards now.\n45\tJack can run quickly.\tNegative\tJack can’t run quickly.\n46\tLucy drinks juice at breakfast.\tQuestion\tDoes Lucy drink juice at breakfast?\n47\tI was scared yesterday.\tToday\tI am scared today.\n48\tWe have eggs. We have toast.\tand\tWe have eggs and toast.",

const selectedClass = localStorage.getItem('sentenceMasterClass') || '3pm';

<script>
let questions = [];
let index = 0;
let timerTimeout;

$(document).ready(function() {
    
    if (!selectedCsvFile) {
        alert('No CSV file selected. Please go back and choose a level.');
        window.location.href = 'Winner.png';
        return;
    }
    
    console.log('Loading CSV file:', selectedCsvFile);
    
    Promise.resolve(new Response(SM_DATA))
        .then(r => {
            if (!r.ok) {
                throw new Error(`Could not load ${selectedCsvFile}`);
            }
            return r.text();
        })
        .then(csv => {
            console.log('CSV loaded, length:', csv.length);
            console.log('First 200 chars:', csv.substring(0, 200));
            
            const lines = csv.split('\n');
            console.log('Total lines:', lines.length);
            
            // Check the header to understand column structure
            const headerLine = lines[0];
            console.log('Header:', headerLine);
            
            // Determine delimiter
            const delimiter = headerLine.includes('\t') ? '\t' : ',';
            console.log('Using delimiter:', delimiter);
            
            // Start from line 1 (skip header)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line === '') {
                    console.log(`Line ${i} is empty, skipping`);
                    continue;
                }
                
                let parts;
                if (delimiter === '\t') {
                    parts = line.split('\t');
                } else {
                    parts = line.split(',');
                }
                
                console.log(`Line ${i} parts:`, parts.length);
                
                // Based on your CSV structure, columns are:
                // parts[0] = Question #
                // parts[1] = Original Sentence (EN)
                // parts[2] = Change To
                // parts[3] = Answer
                
                if (parts.length >= 4) {
                    const question = {
                        original: parts[1] ? parts[1].trim() : '',
                        changeTo: parts[2] ? parts[2].trim() : '',
                        answer: parts[3] ? parts[3].trim() : ''
                    };
                    
                    // Only add if all fields have content
                    if (question.original && question.changeTo && question.answer) {
                        questions.push(question);
                        console.log(`Added question ${questions.length}:`, question.original.substring(0, 30));
                    } else {
                        console.log('Skipping line - missing fields:', question);
                    }
                } else {
                    console.log(`Line ${i} has insufficient parts:`, parts.length);
                }
            }
            
            console.log('Total questions loaded:', questions.length);
            
            if (questions.length === 0) {
                alert('No valid questions found in the CSV file. Please check the file format.');
                return;
            }
            
            // Shuffle questions
            questions.sort(() => Math.random() - 0.5);
            
            showQuestion();
            
            // Set timer for 10 minutes (600000 ms)
            timerTimeout = setTimeout(function() {
                showTimesUpModal();
            }, 600000);
            
            // Listen for animation end on timer bar
            $('.timer-bar').on('animationend', function() {
                showTimesUpModal();
            });
        })
        .catch(error => {
            alert('Error loading CSV: ' + error.message);
            console.error('Fetch error:', error);
        });
});

function showQuestion() {
    if (index >= questions.length) {
        // End of questions - go to index page
        clearTimeout(timerTimeout);
        location.href = 'index.html';
        return;
    }

    const q = questions[index];
    console.log(`Showing question ${index + 1}:`, q);
    
    $('#questionNumber').text(`Question ${index + 1} of ${questions.length}`);
    $('#originalSentence').text(q.original);
    $('#instruction').text(`→ Change to: ${q.changeTo}`);
    $('#answerText').text(q.answer);

    // Hide answer section and reset buttons
    $('#answerSection').hide();
    $('#showAnswerBtn').removeClass('hidden');
    $('#nextBtn').addClass('hidden');
    // End Game button is always visible
    
    // Scroll to top
    $('.card').scrollTop(0);
}

$('#showAnswerBtn').on('click', function() {
    $('#answerSection').slideDown(300, function() {
        // After answer is shown, scroll to make sure buttons are visible
        $('.card').animate({
            scrollTop: $('.card')[0].scrollHeight
        }, 500);
    });
    $(this).addClass('hidden');
    $('#nextBtn').removeClass('hidden');
    // End Game button remains visible
});

$('#nextBtn').on('click', function() {
    index++;
    showQuestion();
});

$('#endBtn').on('click', function() {
    // Show confirmation dialog
    if (confirm('Are you sure you want to end the game?')) {
        clearTimeout(timerTimeout);
        // Show the winner image
        location.href = 'Winner.png';
    }
});

function showTimesUpModal() {
    // Clear the timeout to prevent multiple triggers
    clearTimeout(timerTimeout);
    
    // Show the modal
    $('#timesUpModal').fadeIn(300).css('display', 'flex');
    
    // Pause the timer animation
    $('.timer-bar').css('animation-play-state', 'paused');
}

// Modal OK button click
$('#modalOkBtn').on('click', function() {
    // Show the winner image
    location.href = 'Winner.png';
});

// Clear timeout when leaving page
window.addEventListener('beforeunload', function() {
    clearTimeout(timerTimeout);
});
</script>

</body>
</html>
