<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentence Master Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bubblegum Sans', cursive;
            //background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 1;
            animation: slideIn 0.8s ease-out;
            padding-bottom: 100px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .logo {
            max-width: 700px;
            width: 80%;
            margin-top: 0;
        }

        /* ===== CSV OPTIONS SECTION ===== */
        .csv-selector {
            margin: 15px auto 30px auto;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .csv-option {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
            color: white;
            background: #1A3A5F;
            border: 2px solid #2B4F7C;
        }

        .csv-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            background: #1F4770;
        }

        .csv-option.selected {
            transform: scale(1.15);
            background: #0F2A44;
            border: 3px solid #FFD700;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .csv-option:not(.selected) {
            transform: scale(0.85);
            opacity: 0.8;
            filter: brightness(0.8);
        }

        .csv-selector:has(.selected) .csv-option:not(.selected) {
            transform: scale(0.7);
            opacity: 0.6;
        }

        .button-grid {
            display: flex;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .game-button {
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            padding: 30px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            line-height: 1.3;
            text-align: center;
        }

        .game-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .game-button:hover::before {
            width: 600px;
            height: 600px;
        }

        .game-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .game-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .btn-stage1 {
            background: linear-gradient(145deg, #FFD700, #FFA500);
        }

        .btn-stage3 {
            background: linear-gradient(145deg, #FF6B6B, #EE5A6F);
        }

        .sparkle {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle span {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s linear infinite;
            opacity: 0;
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: translateY(0) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .sparkle span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .sparkle span:nth-child(2) { left: 25%; animation-delay: 0.5s; }
        .sparkle span:nth-child(3) { left: 40%; animation-delay: 1s; }
        .sparkle span:nth-child(4) { left: 55%; animation-delay: 1.5s; }
        .sparkle span:nth-child(5) { left: 70%; animation-delay: 0.3s; }
        .sparkle span:nth-child(6) { left: 85%; animation-delay: 0.8s; }
        .sparkle span:nth-child(7) { left: 90%; animation-delay: 1.3s; }

        @media (max-width: 768px) {
            .button-grid {
                flex-direction: column;
                gap: 25px;
                align-items: center;
            }

            .game-button {
                font-size: 20px;
                padding: 25px 30px;
                min-width: 280px;
                width: 100%;
            }
            
            .csv-selector {
                flex-direction: column;
                gap: 15px;
            }
            
            .csv-option {
                width: 250px;
                font-size: 18px;
                padding: 12px 30px;
            }
            
            .csv-option.selected {
                transform: scale(1.1);
            }
            
            .csv-selector:has(.selected) .csv-option:not(.selected) {
                transform: scale(0.8);
            }
        }
    </style>
</head>
<body>
    <div class="sparkle">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="Sentence Master Logo.png" alt="Sentence Master Challenge" class="logo">
        </div>

        <!-- CSV OPTIONS SECTION - TWO DARK BLUE BUTTONS -->
        <div class="csv-selector">
            <button class="csv-option" id="easyCsvBtn">📚 Beginner Level</button>
            <button class="csv-option" id="hardCsvBtn">🚀 Advanced Level</button>
        </div>

        <!-- TWO GAME BUTTONS - Round 1 and Round 3 (as button 2) -->
        <div class="button-grid">
            <a href="round1.html" class="game-button btn-stage1" id="round1Link">
                Round 1:<br>Team Effort, Buzz & Speak!
            </a>
            <a href="round3.html" class="game-button btn-stage3" id="round3Link">
                Round 2:<br>1 vs. 1, Ultimate Battle
            </a>
        </div>
    </div>

    <script>
        // Define the two CSV files
        const CSV_FILES = {
            easy: 'questions-easy.csv',
            hard: 'questions-hard.csv'
        };
        
        // Default to easy if nothing selected
        let selectedLevel = localStorage.getItem('sentenceMasterLevel') || 'easy';
        
        // Get button elements
        const easyBtn = document.getElementById('easyCsvBtn');
        const hardBtn = document.getElementById('hardCsvBtn');
        
        function setActiveLevel(level) {
            selectedLevel = level;
            localStorage.setItem('sentenceMasterLevel', level);
            localStorage.setItem('sentenceMasterCSV', CSV_FILES[level]);
            
            // Remove selected class from both buttons
            easyBtn.classList.remove('selected');
            hardBtn.classList.remove('selected');
            
            // Add selected class to the active button
            if (level === 'easy') {
                easyBtn.classList.add('selected');
            } else {
                hardBtn.classList.add('selected');
            }
            
            console.log('Selected level:', level);
            console.log('Selected CSV:', CSV_FILES[level]);
        }
        
        // Set initial active state
        setActiveLevel(selectedLevel);
        
        // Add click handlers
        easyBtn.addEventListener('click', function() {
            setActiveLevel('easy');
        });
        
        hardBtn.addEventListener('click', function() {
            setActiveLevel('hard');
        });

        // Handle round links - ensure level is selected
        document.getElementById('round1Link').addEventListener('click', function(e) {
            if (!localStorage.getItem('sentenceMasterCSV')) {
                e.preventDefault();
                alert('⚠️ Please select a difficulty level first!');
            }
        });

        document.getElementById('round3Link').addEventListener('click', function(e) {
            if (!localStorage.getItem('sentenceMasterCSV')) {
                e.preventDefault();
                alert('⚠️ Please select a difficulty level first!');
            }
        });
    </script>
</body>
</html>
